name: daily-rebuild
# 매일 06:00 KST(21:00 UTC) 빈 커밋을 푸시해 Cloudflare 빌드를 돌린다.
# 그날 날짜가 된 예약 글이 이때 공개된다. G2가 새벽 5시에 이미 푸시했으면 중복 빌드 한 번일 뿐이다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "daily-rebuild"
          git config user.email "koii0803@users.noreply.github.com"
          git commit --allow-empty -m "daily rebuild $(date -u +%F)"
          git push
  # 빌드가 끝나 글이 열린 뒤, 오늘 공개된 글 주소를 Google Indexing API에 알린다.
  # 키(GOOGLE_INDEXING_KEY 시크릿)가 없으면 조용히 건너뛴다.
  index:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: Cloudflare 빌드 기다리기
        run: sleep 300
      - env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          if [ -z "$GOOGLE_INDEXING_KEY" ]; then echo "키 없음, 건너뜀"; exit 0; fi
          python scripts/gindex.py
